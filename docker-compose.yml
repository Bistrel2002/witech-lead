# Run the whole stack with one command, on any machine that has Docker.
#
#   docker compose up --build
#
# Nothing else needs installing — no Node, no PostgreSQL. This exists mainly
# so the project starts identically on Windows, where the native setup trips
# over path handling and the root `npm run dev` script.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: witech
      POSTGRES_PASSWORD: witech
      POSTGRES_DB: witech_crm
    volumes:
      - witech-db:/var/lib/postgresql/data
    ports:
      # Exposed so you can inspect the database from the host with psql or a
      # GUI. 5433 on purpose: it will not collide with a PostgreSQL already
      # installed on the machine.
      - "5433:5432"
    healthcheck:
      # The backend awaits getDb() before it listens, so starting it against
      # a database still initialising means a container that never binds its
      # port. It waits for this to pass instead.
      test: ["CMD-SHELL", "pg_isready -U witech -d witech_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    # Optional: the stack starts without it. Anything you do put in .env —
    # AWS keys, Google OAuth — is passed straight through and takes effect.
    env_file:
      - path: .env
        required: false
    environment:
      # Which database the containers use.
      #
      # Defaults to the `db` service beside them — a self-contained stack that
      # touches nothing on the host. Set DOCKER_DATABASE_URL in .env to point
      # them somewhere else, typically your own PostgreSQL:
      #
      #   DOCKER_DATABASE_URL=postgresql://host.docker.internal:5432/witech_crm
      #
      # A separate variable from DATABASE_URL on purpose: DATABASE_URL holds a
      # localhost address for running without Docker, and `localhost` inside a
      # container means the container itself. Reusing it would silently point
      # the backend at nothing.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://witech:witech@db:5432/witech_crm}
      PORT: 3001
      NODE_ENV: development
      BACKEND_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:8080
      # Development defaults, so `docker compose up` works on a fresh clone
      # with no secrets to gather. Each is overridden by .env when present.
      #
      # These are throwaway values for a local machine and must never reach a
      # deployed environment: JWT_SECRET is left unset on purpose so the
      # backend generates a random one per boot and refuses to start in
      # production without a real one.
      ADMIN_PORTAL_PASSWORD: ${ADMIN_PORTAL_PASSWORD:-dev-admin}
      TEAM_PORTAL_PASSWORD: ${TEAM_PORTAL_PASSWORD:-dev-team}
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser resolves this, so it is the host's address for the
        # backend — not the compose service name, which means nothing outside
        # the network.
        VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  witech-db:
