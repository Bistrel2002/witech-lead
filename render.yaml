# ==========================================
# RENDER BLUEPRINT – Witech Lead CRM
# ==========================================
# This file defines the complete infrastructure for Render.
# Deploy both frontend (static site) and backend (web service)
# from a single monorepo.
#
# Usage:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Render auto-detects this file and creates both services
# ==========================================

services:
  # ── Backend API (Express.js Web Service) ──────────────────────
  - type: web
    name: witech-lead-api
    runtime: node
    region: frankfurt  # EU region for French users
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random string
      - key: ADMIN_PORTAL_PASSWORD
        sync: false  # Will prompt you to enter during setup
      - key: TEAM_PORTAL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false  # You'll set this after the frontend deploys
      - key: BACKEND_URL
        sync: false  # You'll set this to the backend's own URL
      - key: VITE_MOCK_AUTH
        value: "false"  # Disable dev bypass in production!

      # ── Platform outreach infrastructure (operator-owned) ──────────
      # bootstrap() calls getPlatformConfig() and aborts the boot in
      # production if any of the eight required keys below is missing.
      # Without them a deploy from this blueprint used to come up healthy,
      # pass its health check, and silently be unable to send a single
      # campaign or attribute a single bounce.
      # Every one is `sync: false`, so Render prompts at deploy time and no
      # secret value is ever committed to this file.
      # See docs/platform-setup.md for how to obtain each of them.

      # Required — the boot fails without these.
      - key: AWS_REGION
        sync: false  # e.g. eu-west-3
      - key: MAIL_ROOT_DOMAIN
        sync: false  # e.g. mail.witechagency.com — must be delegated to Route53
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SENDER_ID
        sync: false  # Shared alphanumeric Sender ID, e.g. WITECH
      - key: SES_WEBHOOK_TOKEN
        sync: false  # Long random string; the SNS subscription URL must carry
                     # the same value as ?token=... — it is the only thing
                     # stopping anyone from posting fake complaint events.
      - key: PUBLIC_API_URL
        sync: false  # Public base URL of THIS backend (not FRONTEND_URL).
                     # Unsubscribe links are served by the backend.
      - key: UNSUBSCRIBE_SECRET
        sync: false  # Long random string; signs unsubscribe tokens. Rotating
                     # it invalidates every unsubscribe link already sent.

      # Required in practice — provisioning and bounce attribution need these.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ROUTE53_HOSTED_ZONE_ID
        sync: false  # Hosted zone for MAIL_ROOT_DOMAIN. Provisioning a tenant
                     # subdomain throws without it.
      - key: SES_CONFIGURATION_SET
        sync: false  # Routes bounce/complaint events to SNS. Optional in code,
                     # but no auto-pause happens without it.

      # Optional — defaults to no-reply.
      - key: MAIL_FROM_LOCAL_PART
        sync: false
    healthCheckPath: /

  # ── Frontend (Vite Static Site) ───────────────────────────────
  - type: web
    name: witech-lead-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA catch-all: serve index.html for all client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # You'll set this to the backend Render URL
      - key: VITE_MOCK_AUTH
        value: "false"
