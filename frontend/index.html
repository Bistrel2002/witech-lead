<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://www.witechagency.com/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Witech Lead - Logiciel de prospection commerciale et automatisation de leads" />
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Witech Lead | Smart Prospecting Suite</title>

    <script>
      // Runs before first paint: apply the stored theme so a dark-mode user
      // never sees a white flash. Kept inline and tiny on purpose — a
      // separate file would load too late to help.
      // Mirrors readInitialTheme() in src/hooks/useTheme.js on purpose: same
      // order of checks (stored value, then system preference, then light)
      // and the same accepted values ('light' / 'dark' only), so this guard
      // and the hook's first render always agree — otherwise the hook would
      // flip the page to the other theme right after mount.
      (function () {
        var t;
        try {
          var stored = localStorage.getItem('witech_theme');
          if (stored === 'light' || stored === 'dark') t = stored;
        } catch (e) { /* private mode: fall through to system preference */ }
        if (t === undefined) {
          t = (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
        }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
