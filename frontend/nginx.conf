server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # index.html is the public vitrine; the application is app.html.
        # A blanket fallback to index.html would answer every unmatched path
        # with the marketing page, including the app's own client-side routes.
        # Those all live under /portal (App.jsx dispatches on
        # /portal/admin-panel and /portal/team-space), so only they fall back,
        # and they fall back to the app rather than to the vitrine.
        try_files $uri $uri/ =404;
    }

    location /portal/ {
        root /usr/share/nginx/html;
        try_files $uri /app.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
